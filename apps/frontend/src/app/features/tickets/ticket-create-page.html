<section class="mx-auto max-w-2xl">
  <a routerLink="/incidencias" class="text-sm font-medium text-brand-700 hover:underline"
    >← Volver a incidencias</a
  >
  <p class="mt-5 text-sm font-medium text-ink-muted">Mesa de ayuda</p>
  <h1 class="mt-1 text-2xl font-semibold tracking-tight">Nueva incidencia</h1>

  <form
    class="mt-6 space-y-5 rounded-xl border border-line bg-white p-5 shadow-sm sm:p-7"
    [formGroup]="form"
    (ngSubmit)="submit()"
  >
    <label for="ticket-title" class="block text-sm font-medium text-ink">
      Título
      <input
        id="ticket-title"
        pInputText
        class="mt-2 w-full !bg-white !text-ink"
        formControlName="title"
        maxlength="150"
        placeholder="Describe brevemente el problema"
        autocomplete="off"
      />
    </label>

    <label for="ticket-description" class="block text-sm font-medium text-ink">
      Descripción
      <textarea
        id="ticket-description"
        pTextarea
        class="mt-2 !h-36 !min-h-36 !max-h-36 !resize-none w-full overflow-y-auto !bg-white !text-ink"
        formControlName="description"
        maxlength="4000"
        rows="6"
        placeholder="Incluye los detalles necesarios para atender la incidencia"
      ></textarea>
      <span class="mt-1 block text-xs font-normal text-ink-muted">Máximo 4000 caracteres.</span>
    </label>

    <div class="grid gap-5 sm:grid-cols-2">
      <label for="ticket-category" class="block text-sm font-medium text-ink">
        Categoría
        <p-select
          inputId="ticket-category"
          class="mt-2 w-full"
          formControlName="categoryId"
          [options]="categories()"
          optionLabel="name"
          optionValue="id"
          placeholder="Selecciona una categoría"
          [loading]="loadingCategories()"
          [showClear]="true"
        ></p-select>
      </label>
      <label for="ticket-priority" class="block text-sm font-medium text-ink">
        Prioridad
        <p-select
          inputId="ticket-priority"
          class="mt-2 w-full"
          formControlName="priority"
          [options]="priorityOptions"
          optionLabel="label"
          optionValue="value"
        ></p-select>
      </label>
    </div>

    @if (error()) {
      <p role="alert" class="rounded-lg bg-danger-50 px-4 py-3 text-sm text-danger-700">
        {{ error() }}
      </p>
    }

    <div class="flex flex-col-reverse gap-3 border-t border-line pt-5 sm:flex-row sm:justify-end">
      <a
        routerLink="/incidencias"
        class="rounded-lg border border-line px-4 py-2.5 text-center text-sm font-medium text-ink-muted hover:bg-canvas"
        >Cancelar</a
      >
      <button
        class="rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700 disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="form.invalid || saving()"
      >
        {{ saving() ? 'Registrando…' : 'Registrar incidencia' }}
      </button>
    </div>
  </form>
</section>
