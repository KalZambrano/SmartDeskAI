<span
  class="inline-flex items-center gap-2 text-[13px]"
  [class.text-priority-high]="isHigh()"
  [class.text-priority-critical]="isCritical()"
  [class.text-indicator-strong]="!isHigh() && !isCritical()"
  [class.font-medium]="!isHigh() && !isCritical()"
  [class.font-semibold]="isHigh() || isCritical()"
  role="img"
  [attr.aria-label]="ariaLabel()"
  [attr.title]="ariaLabel()"
>
  <svg class="size-[14px] shrink-0" viewBox="0 0 14 14" aria-hidden="true">
    <rect
      x="1"
      y="8"
      width="2.5"
      height="5"
      rx="0.5"
      [attr.fill]="filledBars() >= 1 ? 'currentColor' : 'var(--color-indicator-empty)'"
    />
    <rect
      x="5.75"
      y="5"
      width="2.5"
      height="8"
      rx="0.5"
      [attr.fill]="filledBars() >= 2 ? 'currentColor' : 'var(--color-indicator-empty)'"
    />
    <rect
      x="10.5"
      y="2"
      width="2.5"
      height="11"
      rx="0.5"
      [attr.fill]="filledBars() >= 3 ? 'currentColor' : 'var(--color-indicator-empty)'"
    />
  </svg>
  <span>{{ label() }}</span>
</span>
