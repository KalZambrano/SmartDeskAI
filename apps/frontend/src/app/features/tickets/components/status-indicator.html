<span
  class="inline-flex items-center gap-2 text-[13px] text-indicator-strong"
  [class.opacity-70]="isResolved()"
  [class.opacity-55]="isClosed()"
  role="img"
  [attr.aria-label]="ariaLabel()"
  [attr.title]="ariaLabel()"
>
  <svg class="size-[14px] shrink-0" viewBox="0 0 14 14" fill="none" aria-hidden="true">
    @if (isResolved() || isClosed()) {
      <circle cx="7" cy="7" r="5.5" fill="currentColor" />
      <path
        d="m4.1 7.1 1.9 1.8 3.9-4"
        stroke="white"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    } @else if (isPending()) {
      <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5" />
      <path
        d="M5.4 5.1v3.8M8.6 5.1v3.8"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
      />
    } @else if (isInProgress()) {
      <path d="M7 1.5a5.5 5.5 0 0 0 0 11V1.5Z" fill="currentColor" />
      <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5" />
    } @else {
      <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5" />
    }
  </svg>
  <span>{{ label() }}</span>
</span>
