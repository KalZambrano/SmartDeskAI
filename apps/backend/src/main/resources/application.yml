spring:
  application:
    name: smartdesk-ai
  config:
    # Credenciales locales opcionales (apps/backend/local.properties). No existe en Docker.
    import: optional:file:./local.properties,optional:file:./apps/backend/local.properties
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartdesk}
    username: ${POSTGRES_USER:smartdesk}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

smartdesk:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-this-before-use-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
