spring:
  application:
    name: smartdesk-ai
  config:
    # Credenciales locales opcionales (apps/backend/local.properties). No existe en Docker.
    import: optional:file:./local.properties,optional:file:./apps/backend/local.properties
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartdesk}
    username: ${POSTGRES_USER:smartdesk}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

smartdesk:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-this-before-use-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:}
    api-base-url: ${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:20}
    max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:500}
  automation:
    escalation-interval-ms: ${AUTOMATION_ESCALATION_INTERVAL_MS:60000}
  demo-mode:
    enabled: ${DEMO_MODE_ENABLED:false}
